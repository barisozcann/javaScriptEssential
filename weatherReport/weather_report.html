<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Report (Lat/Lon)</title>
</head>
<body>
  <h1>Weather Report (Latitude / Longitude)</h1>

  <!-- Form: Kullanıcıdan lat/lon alacağız -->
  <form id="weatherForm">
    <label for="lat">Latitude (enlem):</label>
    <input type="number" id="lat" name="lat" step="any" required />
    <br /><br />

    <label for="lon">Longitude (boylam):</label>
    <input type="number" id="lon" name="lon" step="any" required />
    <br /><br />

    <button type="submit">Get Weather</button>
  </form>

  <!-- Sonuçları buraya yazacağız -->
  <div id="weatherInfo"></div>

  <script src="./weather_report.js"></script>
</body>
</html>
